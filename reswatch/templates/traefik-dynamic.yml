# generated by reswatch setup — re-run to change
# Load with Traefik's file provider, e.g. in traefik.yml:
#   providers: { file: { filename: /etc/traefik/dynamic/reswatch.yml } }
# Traefik proxies WebSockets and sets X-Forwarded-* headers by itself.
http:
  routers:
    reswatch:
      rule: "{{traefik_rule}}"
      entryPoints: [websecure]
      service: reswatch
      tls:
        certResolver: {{cert_resolver}}
  services:
    reswatch:
      loadBalancer:
        servers:
          - url: "http://127.0.0.1:{{port}}"
