# generated by reswatch setup — re-run to change
# Install: sudo cp deploy/nginx.conf /etc/nginx/sites-available/reswatch
#          sudo ln -s /etc/nginx/sites-available/reswatch /etc/nginx/sites-enabled/
#          sudo nginx -t && sudo systemctl reload nginx
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    listen [::]:80;
    server_name {{domain}};
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name {{domain}};

    # certificates, e.g. from: sudo certbot certonly --nginx -d {{domain}}
    ssl_certificate     /etc/letsencrypt/live/{{domain}}/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/{{domain}}/privkey.pem;
{{nginx_base_redirect}}
    location {{location}} {
        proxy_pass http://127.0.0.1:{{port}};
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;          # WebSocket (/ws)
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 1h;
        proxy_buffering off;
    }
}
