# generated by reswatch setup — re-run to change
# Needs Apache >= 2.4.47 and:  sudo a2enmod ssl proxy proxy_http proxy_wstunnel headers
# Install: sudo cp deploy/apache.conf /etc/apache2/sites-available/reswatch.conf
#          sudo a2ensite reswatch && sudo apachectl configtest && sudo systemctl reload apache2
<VirtualHost *:80>
    ServerName {{domain}}
    Redirect permanent / https://{{domain}}/
</VirtualHost>

<VirtualHost *:443>
    ServerName {{domain}}
    SSLEngine on
    # certificates, e.g. from: sudo certbot certonly --apache -d {{domain}}
    SSLCertificateFile    /etc/letsencrypt/live/{{domain}}/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/{{domain}}/privkey.pem

    ProxyPreserveHost On
    RequestHeader set X-Forwarded-Proto "https"
    # upgrade=websocket proxies the /ws stream
    ProxyPass        "{{location}}" "http://127.0.0.1:{{port}}{{location}}" upgrade=websocket timeout=3600
    ProxyPassReverse "{{location}}" "http://127.0.0.1:{{port}}{{location}}"
</VirtualHost>
