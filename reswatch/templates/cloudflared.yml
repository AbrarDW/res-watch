# generated by reswatch setup — re-run to change
# 1. cloudflared tunnel login
# 2. cloudflared tunnel create reswatch            (prints the TUNNEL-ID)
# 3. cloudflared tunnel route dns reswatch {{domain}}
# 4. replace TUNNEL-ID below, copy to ~/.cloudflared/config.yml, then:
#    sudo cloudflared service install      (or: cloudflared tunnel run reswatch)
# Cloudflare terminates HTTPS and proxies WebSockets. To put a login in front,
# create a Cloudflare Access application for {{domain}} (Zero Trust dashboard).
tunnel: TUNNEL-ID
credentials-file: /root/.cloudflared/TUNNEL-ID.json
ingress:
  - hostname: {{domain}}
{{cf_path}}    service: http://127.0.0.1:{{port}}
  - service: http_status:404
