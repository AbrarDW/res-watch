# generated by reswatch setup — re-run to change
# Start:  docker compose up -d --build      Logs: docker compose logs -f
services:
  reswatch:
    build: .
    image: reswatch:latest
    restart: unless-stopped
    pid: host                  # required: lets the container see the host's processes
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    tmpfs: [/tmp]
{{user}}    environment:
      RESWATCH_AUTH: "{{auth}}"
      RESWATCH_TRUSTED_PROXY: "{{trusted_proxy}}"
      RESWATCH_BASE_PATH: "{{base_path}}"
{{volumes}}{{ports}}{{gpu_compose}}{{traefik_labels}}
