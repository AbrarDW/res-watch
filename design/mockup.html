<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>res-watch mockup</title>
<link rel="stylesheet" href="../static/style.css">
<script src="../static/vendor/echarts.min.js"></script>
<script src="../static/vendor/echarts-gl.min.js"></script>
<script src="../static/charts.js"></script>
</head>
<body>
<!--
  Static design mockup with fake data. Query params:
    tab=overview|cpu|gpu|details   view=bars|heatmap|3d (cpu) / 2d|3d (gpu)
    theme=light|dark   empty=1   mview=list|charts (mobile panel)
-->
<div class="app">
  <header class="topbar">
    <div class="brand"><span class="brand-dot"></span>res-watch</div>
    <div class="meters" id="meters"></div>
    <div class="corestrip" id="corestrip" title="System usage per logical core"></div>
    <div class="spacer"></div>
    <div class="controls">
      <select class="btn optional"><option>1 s</option><option>2 s</option><option>5 s</option></select>
      <button class="btn optional">⏸ Pause</button>
      <button class="btn" title="Toggle theme">☾ Theme</button>
    </div>
  </header>
  <nav class="mobile-tabs" id="mtabs">
    <button data-v="list">Processes</button><button data-v="charts">Charts</button>
  </nav>
  <div class="body" id="body">
    <aside class="sidebar">
      <div class="side-head" id="sidehead"></div>
      <div class="ptable-wrap">
        <table class="ptable" id="ptable"></table>
      </div>
      <div class="side-foot"><span>Sort: CPU</span><span>⟳ every 3 s</span></div>
    </aside>

    <main class="main" id="main"></main>
  </div>
</div>

<script>
const P = new URLSearchParams(location.search);
const TAB = P.get('tab') || 'overview';
const VIEW = P.get('view') || (TAB === 'gpu' ? '2d' : 'bars');
const EMPTY = P.get('empty') === '1';
if (P.get('theme')) document.documentElement.dataset.theme = P.get('theme');
document.getElementById('body').dataset.mview = P.get('mview') || 'charts';
document.querySelectorAll('#mtabs button').forEach(b => b.classList.toggle('on', b.dataset.v === (P.get('mview') || 'charts')));

const css = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim();
const C = {
  text: css('--text'), text2: css('--text-2'), text3: css('--text-3'), grid: css('--grid'), border: css('--border'),
  surface: css('--surface'), ghost: css('--ghost'),
  s: [1,2,3,4,5,6,7,8].map(i => css('--s' + i)),
  q: [0,1,2,3,4,5].map(i => css('--q' + i)),
};

// ---------- deterministic fake data ----------
let seed = 7;
const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
const N = 60, CORES = 16;
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const walk = (base, amp, lo = 0, hi = 100) => { let v = base; return Array.from({length: N}, () => (v = clamp(v + (rnd() - 0.5) * amp + (base - v) * 0.15, lo, hi))); };

const procs = [
  {pid: 9134, name: 'python',   user: 'abi',  cpu: 121.0, mem: '3.1 G', gpu: 68, sel: 1, cmd: 'python train.py --epochs 40 --batch 64', threads: 9, up: '5m 02s'},
  {pid: 4821, name: 'chrome',   user: 'abi',  cpu: 34.2,  mem: '1.2 G', gpu: 4,  sel: 2, cmd: '/opt/google/chrome/chrome --type=renderer', threads: 42, up: '2h 14m'},
  {pid: 1022, name: 'code',     user: 'abi',  cpu: 8.7,   mem: '860 M', gpu: 0},
  {pid: 5560, name: 'node',     user: 'abi',  cpu: 6.3,   mem: '412 M', gpu: null},
  {pid: 733,  name: 'postgres', user: 'postgres', cpu: 2.1, mem: '120 M', gpu: null},
  {pid: 2877, name: 'Xorg',     user: 'root', cpu: 1.8,   mem: '96 M',  gpu: 2},
  {pid: 1408, name: 'pipewire', user: 'abi',  cpu: 0.9,   mem: '24 M',  gpu: null},
  {pid: 1,    name: 'systemd',  user: 'root', cpu: 0.0,   mem: '12 M',  gpu: null},
  {pid: 2210, name: 'sshd',     user: 'root', cpu: 0.0,   mem: '8 M',   gpu: null},
  {pid: 612,  name: 'dockerd',  user: 'root', cpu: 0.4,   mem: '88 M',  gpu: null},
  {pid: 3051, name: 'kworker/3:1', user: 'root', denied: true},
  {pid: 3077, name: 'kworker/7:0', user: 'root', denied: true},
  {pid: 845,  name: 'NetworkManager', user: 'root', cpu: 0.1, mem: '18 M', gpu: null},
  {pid: 990,  name: 'gnome-shell', user: 'abi', cpu: 3.4, mem: '310 M', gpu: 1},
  {pid: 1777, name: 'slack',    user: 'abi',  cpu: 1.2,   mem: '540 M', gpu: 0},
  {pid: 6020, name: 'bash',     user: 'abi',  cpu: 0.0,   mem: '5 M',   gpu: null},
];
const SIDE = P.get('side') || 'apps';           // apps | procs | tree
const FILTERS = P.get('filters') === '1';        // filter popover open
procs[1].sel = 0;                                // chrome is selected as a whole app instead
const chromeApp = {kind: 'app', key: 'chrome', name: 'chrome', pid: '×23', count: 23, cpu: 34.2, mem: '2.8 G', gpu: 4, threads: 312,
  user: 'abi', up: '2h 14m', cmd: '23 processes · /opt/google/chrome/chrome'};
const selected = EMPTY ? [] : [procs[0], chromeApp];
selected.forEach((p, i) => p.color = C.s[i]);
const focus = selected[0];

// apps (grouped by cgroup scope / exe tree) — "Mine" filter active, so root/system apps are hidden
const apps = [
  {key: 'python', L: 'P', count: 2, cpu: 121.3, mem: '3.1 G', gpu: 68, part: true, members: [
    {pid: 9134, name: 'python', role: 'train.py', cpu: 121.0, mem: '3.1 G', gpu: 68, sel: true},
    {pid: 9101, name: 'python', role: 'tensorboard', cpu: 0.3, mem: '96 M', gpu: null}]},
  {key: 'chrome', L: 'C', count: 23, cpu: 34.2, mem: '2.8 G', gpu: 4, sel: true, open: true, members: [
    {pid: 4821, name: 'renderer', cpu: 18.1, mem: '410 M', gpu: null},
    {pid: 4790, name: 'gpu-process', cpu: 9.4, mem: '220 M', gpu: 4},
    {pid: 4702, name: 'chrome', role: 'main', cpu: 4.2, mem: '380 M', gpu: null},
    {pid: 4855, name: 'renderer', cpu: 1.6, mem: '190 M', gpu: null},
    {pid: 4870, name: 'utility · network', cpu: 0.5, mem: '62 M', gpu: null}], more: 18},
  {key: 'code', L: 'V', count: 14, cpu: 8.7, mem: '1.6 G', gpu: 0},
  {key: 'node', L: 'N', count: 3, cpu: 6.3, mem: '412 M', gpu: null},
  {key: 'gnome-shell', L: 'G', count: 1, cpu: 3.4, mem: '310 M', gpu: 1},
  {key: 'slack', L: 'S', count: 6, cpu: 1.2, mem: '540 M', gpu: 0},
  {key: 'pipewire', L: 'P', count: 3, cpu: 0.9, mem: '38 M', gpu: null},
  {key: 'firefox', L: 'F', count: 11, cpu: 0.7, mem: '1.1 G', gpu: 0},
  {key: 'bash', L: 'B', count: 4, cpu: 0.0, mem: '18 M', gpu: null},
  {key: 'spotify', L: 'S', count: 5, cpu: 0.4, mem: '420 M', gpu: 0},
];

const sysCores = Array.from({length: CORES}, (_, i) => [62, 18, 25, 96, 14, 9, 31, 22, 12, 28, 8, 88, 20, 11, 35, 15][i]);
// python: 1 hot core (C3) + C11 busy + light spread; chrome: light spread
const procCoreNow = {
  9134: sysCores.map((v, i) => i === 3 ? 92 : i === 11 ? 71 : i === 0 ? 14 : rnd() < 0.4 ? rnd() * 6 : 0),
  4821: sysCores.map((v, i) => [0, 6, 14].includes(i) ? 8 + rnd() * 10 : rnd() * 3),
};
const coreHist = Array.from({length: CORES}, (_, c) => walk(procCoreNow[9134][c], c === 3 || c === 11 ? 18 : 6, 0, 100));
coreHist[3] = coreHist[3].map(v => clamp(v + 10, 0, 100));
const timeLabels = Array.from({length: N}, (_, i) => i === N - 1 ? 'now' : `-${N - 1 - i}s`);

// ---------- top bar ----------
const ringCls = v => v > 90 ? 'crit' : v > 70 ? 'warn' : '';
function meter(label, value, pct, extra = '') {
  return `<div class="meter ${extra}"><div class="ring ${ringCls(pct)}" style="--v:${pct}"></div>
    <div><div class="meter-label">${label}</div><div class="meter-value num">${value}</div></div></div>`;
}
document.getElementById('meters').innerHTML =
  meter('CPU', '58%', 58) + meter('RAM', '11.2 / 16 GB', 70, 'optional') + meter('GPU0 · RTX 4070', '72% · 6.1/12 GB', 72);
document.getElementById('corestrip').innerHTML = sysCores.map((v, i) => `<i title="C${i} ${v}%" style="height:${Math.max(8, v)}%"></i>`).join('');

// ---------- sidebar ----------
const sel = !EMPTY;
const cpuCell = v => `<td class="bar-cell">${v.toFixed(1)}<span class="b" style="width:${Math.min(60, v / 2)}px"></span></td>`;
const gpuCell = g => `<td class="${g == null ? 'faint' : ''}">${g == null ? '–' : g}</td>`;
document.getElementById('sidehead').innerHTML = `
  <div class="side-title">
    <div class="seg">${[['apps', 'Apps'], ['procs', 'Processes'], ['tree', 'Tree']].map(([k, l]) => `<button class="${k === SIDE ? 'on' : ''}">${l}</button>`).join('')}</div>
    <span class="faint num">${SIDE === 'apps' ? '41 apps' : '187 / 312 shown'}</span>
  </div>
  <div class="side-row">
    <input class="search" placeholder="Search name, PID, app…">
    <button class="btn fbtn ${FILTERS ? 'on' : ''}">⚙ Filters<span class="n">2</span></button>
  </div>
  <div class="fchips"><span class="fchip">User: Mine <span class="x">✕</span></span><span class="fchip">Hide system <span class="x">✕</span></span><button class="linkbtn">Clear all</button></div>
  ${FILTERS ? `<div class="popover">
    <h4>Filters</h4>
    <div class="prow"><span>User</span><div><label><input type="radio" name="u" checked> Mine</label><label><input type="radio" name="u"> All</label><label><input type="radio" name="u"> System</label></div></div>
    <div class="prow full"><label><input type="checkbox" checked> Hide kernel threads &amp; system services</label></div>
    <div class="prow full"><label><input type="checkbox"> Only processes using the GPU</label></div>
    <div class="prow"><span>Min CPU</span><div class="slider"><div class="track"><i style="width:4%"></i><b style="left:4%"></b></div><span class="num">2%</span></div></div>
    <div class="prow"><span>Status</span><div><label><input type="checkbox" checked> running</label><label><input type="checkbox" checked> sleeping</label><label><input type="checkbox"> zombie</label></div></div>
    <div class="prow"><span>Group by</span><div><select class="btn"><option>App (cgroup / bundle / tree)</option><option>Executable</option><option>User</option></select></div></div>
    <div class="pfoot"><button class="btn">Reset</button><button class="btn primary">Done</button></div>
  </div>` : ''}`;

const ptable = document.getElementById('ptable');
if (SIDE === 'apps') {
  ptable.innerHTML = `<thead><tr><th class="l" style="width:22px"></th><th class="l">App</th><th>#</th><th class="sorted">CPU % ▾</th><th>Mem</th><th>GPU %</th></tr></thead><tbody>` +
    apps.map(a => {
      const c = a.key === 'chrome' ? C.s[1] : a.key === 'python' ? C.s[0] : '';
      const cls = sel && a.sel ? 'sel' : sel && a.part ? 'part' : '';
      let h = `<tr class="${cls}" style="${c ? `--c:${c}` : ''}"><td class="l"><span class="chk"></span></td>
        <td class="l name" style="max-width:150px"><span class="twist">${a.open ? '▾' : '▸'}</span><span class="avatar">${a.L}</span>${a.key}</td>
        <td><span class="count">${a.count}</span></td>${cpuCell(a.cpu)}<td>${a.mem}</td>${gpuCell(a.gpu)}</tr>`;
      if (a.open) {
        h += a.members.map(m => `<tr class="member ${sel && (a.sel || m.sel) ? 'sel' : ''}" style="--c:${c}"><td class="l"><span class="chk"></span></td>
          <td class="l name" title="${m.name}"><span class="mono faint">${m.pid}</span> ${m.name}${m.role ? ` <span class="faint">(${m.role})</span>` : ''}</td><td></td>
          <td>${m.cpu.toFixed(1)}</td><td>${m.mem}</td>${gpuCell(m.gpu)}</tr>`).join('');
        if (a.more) h += `<tr class="more" style="--c:${c}"><td></td><td class="l" colspan="5">… ${a.more} more processes</td></tr>`;
      }
      return h;
    }).join('') + '</tbody>';
} else if (SIDE === 'procs') {
  const rows = [
    {...procs[0], app: 'python', c: C.s[0], sel: 1}, {pid: 4821, name: 'renderer', app: 'chrome', cpu: 18.1, mem: '410 M', gpu: null, c: C.s[1], sel: 1},
    {pid: 4790, name: 'gpu-process', app: 'chrome', cpu: 9.4, mem: '220 M', gpu: 4, c: C.s[1], sel: 1},
    {pid: 1022, name: 'code', app: 'code', cpu: 8.7, mem: '860 M', gpu: 0}, {pid: 5560, name: 'node', app: 'node', cpu: 6.3, mem: '412 M', gpu: null},
    {pid: 4702, name: 'chrome', app: 'chrome', cpu: 4.2, mem: '380 M', gpu: null, c: C.s[1], sel: 1},
    {pid: 990, name: 'gnome-shell', app: 'gnome-shell', cpu: 3.4, mem: '310 M', gpu: 1}, {pid: 1033, name: 'code', app: 'code', cpu: 2.2, mem: '240 M', gpu: null},
    {pid: 4855, name: 'renderer', app: 'chrome', cpu: 1.6, mem: '190 M', gpu: null, c: C.s[1], sel: 1},
    {pid: 1777, name: 'slack', app: 'slack', cpu: 1.2, mem: '540 M', gpu: 0}, {pid: 1408, name: 'pipewire', app: 'pipewire', cpu: 0.9, mem: '24 M', gpu: null},
    {pid: 7021, name: 'firefox', app: 'firefox', cpu: 0.7, mem: '480 M', gpu: 0}, {pid: 4870, name: 'utility', app: 'chrome', cpu: 0.5, mem: '62 M', gpu: null, c: C.s[1], sel: 1},
    {pid: 8810, name: 'spotify', app: 'spotify', cpu: 0.4, mem: '310 M', gpu: 0}, {pid: 9101, name: 'python', app: 'python', cpu: 0.3, mem: '96 M', gpu: null},
    {pid: 6020, name: 'bash', app: 'bash', cpu: 0.0, mem: '5 M', gpu: null},
  ];
  ptable.innerHTML = `<thead><tr><th class="l" style="width:22px"></th><th class="l">PID</th><th class="l">Name</th><th class="l">App</th><th class="sorted">CPU % ▾</th><th>Mem</th><th>GPU</th></tr></thead><tbody>` +
    rows.map(p => `<tr class="${sel && p.sel ? 'sel' : ''}" style="${p.c ? `--c:${p.c}` : ''}"><td class="l"><span class="chk"></span></td>
      <td class="l mono faint">${p.pid}</td><td class="l name">${p.name}</td><td class="l"><span class="appbadge">${p.app}</span></td>
      ${cpuCell(p.cpu)}<td>${p.mem}</td>${gpuCell(p.gpu)}</tr>`).join('') + '</tbody>';
} else {
  const tree = [
    ['', 1, 'systemd', 0.0, '12 M'], ['├─ ', 845, 'NetworkManager', 0.1, '18 M'], ['├─ ', 980, 'systemd --user', 0.0, '9 M'],
    ['│  ├─ ', 990, 'gnome-shell', 3.4, '310 M'], ['│  │  ├─ ', 4702, 'chrome', 4.2, '380 M', 1], ['│  │  │  ├─ ', 4790, 'chrome · gpu-process', 9.4, '220 M', 1],
    ['│  │  │  ├─ ', 4821, 'chrome · renderer', 18.1, '410 M', 1], ['│  │  │  ├─ ', 4855, 'chrome · renderer', 1.6, '190 M', 1],
    ['│  │  │  └─ ', 4870, 'chrome · utility', 0.5, '62 M', 1], ['│  │  ├─ ', 1022, 'code', 8.7, '860 M'], ['│  │  │  └─ ', 1033, 'code · extensionHost', 2.2, '240 M'],
    ['│  │  └─ ', 1777, 'slack', 1.2, '540 M'], ['│  ├─ ', 1408, 'pipewire', 0.9, '24 M'], ['│  └─ ', 6020, 'bash', 0.0, '5 M'],
    ['│     ├─ ', 9134, 'python train.py', 121.0, '3.1 G', 0], ['│     └─ ', 9101, 'python tensorboard', 0.3, '96 M'], ['└─ ', 612, 'dockerd', 0.4, '88 M'],
  ];
  ptable.innerHTML = `<thead><tr><th class="l" style="width:22px"></th><th class="l">Process tree</th><th class="sorted">CPU %</th><th>Mem</th></tr></thead><tbody>` +
    tree.map(([pfx, pid, name, cpu, mem, s]) => `<tr class="${sel && s != null ? 'sel' : ''}" style="${s != null ? `--c:${C.s[s === 1 ? 1 : 0]}` : ''}">
      <td class="l"><span class="chk"></span></td><td class="l name" style="max-width:250px"><span class="tree-pfx">${pfx}</span><span class="mono faint">${pid}</span> ${name}</td>
      <td>${cpu.toFixed(1)}</td><td>${mem}</td></tr>`).join('') + '</tbody>';
}

// ---------- main ----------
const main = document.getElementById('main');
const charts = [];
const mk = (id, opt) => { const c = echarts.init(document.getElementById(id), null, {renderer: 'canvas'}); c.setOption(opt); charts.push(c); return c; };
addEventListener('resize', () => charts.forEach(c => c.resize()));

const baseAxis = {
  axisLine: {lineStyle: {color: C.border}}, axisTick: {show: false},
  axisLabel: {color: C.text3, fontSize: 11}, splitLine: {lineStyle: {color: C.grid}},
};
const tip = {trigger: 'axis', backgroundColor: C.surface, borderColor: C.border, textStyle: {color: C.text, fontSize: 12}};
const lineOpt = (series, {unit = '', max} = {}) => ({
  animation: false, grid: {left: 44, right: 12, top: 12, bottom: 24}, tooltip: tip,
  xAxis: {type: 'category', data: timeLabels, boundaryGap: false, ...baseAxis, splitLine: {show: false},
          axisLabel: {...baseAxis.axisLabel, interval: 14}},
  yAxis: {type: 'value', max, ...baseAxis, axisLine: {show: false}, axisLabel: {...baseAxis.axisLabel, formatter: v => v + unit}},
  series: series.map(s => ({type: 'line', showSymbol: false, smooth: 0.3, lineStyle: {width: 2}, ...s})),
});

function focusBar() {
  return `<div class="focusbar">
    <span class="faint">Selected</span>
    ${selected.map((p, i) => `<span class="chip" style="--c:${p.color}"><span class="dot ${p.kind === 'app' ? 'sq' : ''}"></span>${p.kind === 'app' ? '▣ ' : ''}${p.name} <span class="faint mono">${p.pid}</span><span class="x">×</span></span>`).join('')}
    <span class="spacer" style="flex:1"></span>
    <button class="btn">Clear</button>
  </div>
  <div class="tabs">
    ${[['overview','Overview'],['cpu','CPU per core'],['gpu','GPU'],['details','Details']].map(([k, l]) => `<button class="tab ${k === TAB ? 'active' : ''}">${l}</button>`).join('')}
  </div>`;
}
const legend = items => `<div class="legend">${items.map(([l, c, cls]) => `<span><i class="${cls || ''}" style="--c:${c}"></i>${l}</span>`).join('')}</div>`;
const procLegend = () => legend(selected.map(p => [`${p.name} ${p.pid}`, p.color]));

if (EMPTY) {
  main.innerHTML = `<div class="empty"><div>
    <div class="ill"><svg width="40" height="40" viewBox="0 0 40 40" fill="none" stroke="${C.s[0]}" stroke-width="2.5" stroke-linecap="round"><path d="M6 32h28"/><path d="M10 26l7-8 6 5 9-12"/></svg></div>
    <h2>No process selected</h2>
    <p>Tick one or more processes on the left to see live CPU, per-core, GPU, memory and disk charts.</p>
  </div></div>`;
} else if (TAB === 'overview') {
  main.innerHTML = focusBar() + `
    <div class="toolbar"><label><input type="checkbox" checked> Include child processes</label>
      <label><input type="checkbox"> Normalise CPU by cores</label><span class="spacer" style="flex:1"></span>${procLegend()}</div>
    <div class="grid g2">
      <div class="card"><div class="card-h"><h3>CPU</h3><span class="sub">% of one core · last 60 s</span></div><div class="chart" id="c-cpu"></div></div>
      <div class="card"><div class="card-h"><h3>GPU</h3><span class="sub">SM utilisation · GPU0</span></div><div class="chart" id="c-gpu"></div></div>
      <div class="card"><div class="card-h"><h3>Memory</h3><span class="sub">resident set size</span></div><div class="chart" id="c-mem"></div></div>
      <div class="card"><div class="card-h"><h3>Disk I/O</h3><span class="sub">KB/s · solid = read, dashed = write</span></div><div class="chart" id="c-io"></div></div>
    </div>
    <div class="grid g2">
      ${selected.map(p => `<div class="card"><div class="card-h"><h3><span style="color:${p.color}">●</span> ${p.name} <span class="faint mono">${p.pid}</span></h3><span class="badge ok">running</span></div>
        <div class="stats" style="grid-template-columns:repeat(4,1fr)">
          <div class="stat"><div class="k">CPU</div><div class="v num">${p.cpu}%</div></div>
          <div class="stat"><div class="k">Memory</div><div class="v num">${p.mem}</div></div>
          <div class="stat"><div class="k">GPU</div><div class="v num">${p.gpu}%</div></div>
          <div class="stat"><div class="k">Threads</div><div class="v num">${p.threads}</div></div>
        </div><div class="faint mono" style="margin-top:6px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${p.cmd}</div></div>`).join('')}
    </div>`;
  const cpuA = walk(118, 30, 60, 160), cpuB = walk(34, 14, 10, 70);
  mk('c-cpu', lineOpt([{name: 'python', data: cpuA, color: selected[0].color, areaStyle: {opacity: 0.08}},
                       {name: 'chrome', data: cpuB, color: selected[1].color}], {unit: '%'}));
  mk('c-gpu', lineOpt([{name: 'python', data: walk(68, 20, 30, 98), color: selected[0].color, areaStyle: {opacity: 0.08}},
                       {name: 'chrome', data: walk(4, 4, 0, 12), color: selected[1].color}], {unit: '%', max: 100}));
  let m = 2.6; const memA = Array.from({length: N}, () => (m = Math.min(3.1, m + rnd() * 0.02)));
  mk('c-mem', lineOpt([{name: 'python', data: memA, color: selected[0].color, areaStyle: {opacity: 0.08}},
                       {name: 'chrome', data: walk(2.75, 0.06, 2.6, 2.9), color: selected[1].color}], {unit: ' G'}));
  mk('c-io', lineOpt([{name: 'python read', data: walk(820, 600, 0, 2400), color: selected[0].color},
                      {name: 'python write', data: walk(260, 300, 0, 900), color: selected[0].color, lineStyle: {width: 2, type: 'dashed'}},
                      {name: 'chrome read', data: walk(60, 80, 0, 300), color: selected[1].color},
                      {name: 'chrome write', data: walk(30, 40, 0, 150), color: selected[1].color, lineStyle: {width: 2, type: 'dashed'}}]));
} else if (TAB === 'cpu') {
  // Same builders as the app (static/charts.js), fed with sample data for both selections.
  const R = window.RWCharts, CC = R.colors();
  const chromeHist = Array.from({length: CORES}, (_, c) => walk(procCoreNow[4821][c], 8, 0, 40));
  const ents = selected.map(p => p.kind === 'app'
    ? {name: 'chrome ×23', color: p.color, now: procCoreNow[4821], hist: chromeHist}
    : {name: `${p.name} ${p.pid}`, color: p.color, now: procCoreNow[9134], hist: coreHist});
  const times = Array.from({length: N}, (_, i) => i);
  const lg = items => `<div class="legend">${items.map(([l, c, cls]) => `<span><i class="${cls || ''}" style="--c:${c}"></i>${l}</span>`).join('')}</div>`;
  main.innerHTML = focusBar() + `
    <div class="toolbar">
      <div class="seg">${[['bars','Bars'],['heatmap','Heatmap'],['3d','3D']].map(([k, l]) => `<button class="${k === VIEW ? 'on' : ''}">${l}</button>`).join('')}</div>
      <span class="faint">2 selected · 321 threads on 16 logical cores</span>
      <span class="spacer" style="flex:1"></span>
      ${VIEW === 'heatmap' ? '<span class="ramp">0% <b></b> 100%</span>' : lg([...ents.map(e => [e.name, e.color]), ...(VIEW === 'bars' ? [['whole system', '', 'ghost']] : [])])}
      ${VIEW === '3d' ? '<button class="btn">⟲ Auto-rotate</button><button class="btn">Reset view</button>' : ''}
    </div>
    ${VIEW === 'heatmap'
      ? ents.map((e, i) => `<div class="card"><div class="card-h"><h3><span style="color:${e.color}">${i ? '■' : '●'}</span> ${e.name}</h3><span class="sub">usage per core over the last 60 samples</span></div><div class="chart" id="c-heat${i}" style="height:290px"></div></div>`).join('')
      : `<div class="card"><div class="card-h"><h3>${VIEW === 'bars' ? 'Usage per logical core — now' : '3D · core × time × usage'}</h3>
          <span class="sub">${VIEW === '3d' ? 'stacked by selection · drag to rotate · scroll to zoom' : 'stacked by selection · thread CPU time credited to the core it last ran on'}</span></div>
          <div class="chart ${VIEW === '3d' ? 'xl' : 'tall'}" id="c-main"></div></div>`}
    <div class="card"><div class="card-h"><h3>Cores</h3><span class="sub">share of each core taken by the selection · one line per item, last 60 samples</span></div>
      <div class="cores" id="cores"></div></div>`;
  if (VIEW === 'bars') mk('c-main', R.coreBars(CC, sysCores, ents.map(e => ({name: e.name, color: e.color, values: e.now.map(v => +v.toFixed(1))}))));
  else if (VIEW === 'heatmap') ents.forEach((e, i) => mk('c-heat' + i, R.heat(CC, times, e.hist)));
  else mk('c-main', R.bars3d(CC, times, ents.map(e => ({name: e.name, color: e.color, rows: e.hist}))));
  document.getElementById('cores').innerHTML = sysCores.map((sv, i) => {
    const parts = ents.map(e => ({v: e.now[i], c: e.color}));
    const tot = parts.reduce((t, x) => t + x.v, 0), lead = parts.reduce((a, x) => x.v > a.v ? x : a);
    return `<div class="core ${tot > 50 ? 'hot' : ''}" style="--c:${lead.c}"><div class="t"><span>C${i}</span><span>sys ${sv}%</span></div>
      <div class="v num">${tot.toFixed(tot < 10 ? 1 : 0)}%</div>
      <div class="segbar">${parts.filter(x => x.v > 0).map(x => `<i style="width:${Math.min(100, x.v)}%;background:${x.c}"></i>`).join('')}</div>
      <div class="spark">${R.sparkMulti(ents.map(e => ({values: e.hist[i], color: e.color})))}</div></div>`;
  }).join('');
} else if (TAB === 'gpu') {
  main.innerHTML = focusBar() + `
    <div class="toolbar"><div class="seg"><button class="${VIEW === '2d' ? 'on' : ''}">2D</button><button class="${VIEW === '3d' ? 'on' : ''}">3D</button></div>
      <span class="faint">NVIDIA driver 560.35 · NVML</span><span class="spacer" style="flex:1"></span>${procLegend()}</div>
    <div class="grid g-gpu">
      <div class="card gpu-dev">
        <div class="card-h"><h3>GPU0 · RTX 4070</h3><span class="badge ok">active</span></div>
        <div class="chart" id="c-gauge" style="height:150px"></div>
        <div class="rows">
          <span class="muted">Memory</span><span class="num">6.1 / 12.0 GB</span>
        </div>
        <div class="meterbar"><i style="width:51%"></i></div>
        <div class="rows">
          <span class="muted">Temperature</span><span class="num">64 °C</span>
          <span class="muted">Power</span><span class="num">142 / 200 W</span>
          <span class="muted">Clock</span><span class="num">2475 MHz</span>
          <span class="muted">Fan</span><span class="num">48%</span>
        </div>
      </div>
      <div class="card"><div class="card-h"><h3>${VIEW === '3d' ? '3D · engine × time × utilisation' : 'Engine utilisation'}</h3><span class="sub">${VIEW === '3d' ? 'drag to rotate' : 'SM · memory controller · encoder · decoder'}</span></div>
        <div class="chart ${VIEW === '3d' ? 'tall' : ''}" id="c-eng" style="${VIEW === '3d' ? '' : 'height:290px'}"></div></div>
    </div>
    <div class="grid g2">
      <div class="card"><div class="card-h"><h3>GPU memory by process</h3><span class="sub">stacked · GB</span></div><div class="chart" id="c-gmem"></div></div>
      <div class="card"><div class="card-h"><h3>GPU utilisation by process</h3><span class="sub">SM % · now</span></div><div class="chart" id="c-gutil"></div></div>
    </div>
    <div class="note">Per-process GPU figures come from NVML. On machines without an NVIDIA/AMD driver this tab shows “GPU metrics unavailable”.</div>`;
  mk('c-gauge', {series: [{type: 'gauge', startAngle: 210, endAngle: -30, min: 0, max: 100, radius: '96%', center: ['50%', '58%'],
    progress: {show: true, width: 12, roundCap: true, itemStyle: {color: C.s[0]}}, axisLine: {lineStyle: {width: 12, color: [[1, C.grid]]}, roundCap: true},
    axisTick: {show: false}, splitLine: {show: false}, axisLabel: {show: false}, pointer: {show: false},
    title: {offsetCenter: [0, '38%'], color: C.text3, fontSize: 12},
    detail: {offsetCenter: [0, '0%'], formatter: '{value}%', color: C.text, fontSize: 30, fontWeight: 700},
    data: [{value: 72, name: 'utilisation'}]}]});
  const eng = {SM: walk(72, 20, 30, 99), MEM: walk(41, 12, 15, 70), ENC: walk(0, 1, 0, 3), DEC: walk(3, 4, 0, 12)};
  if (VIEW === '3d') {
    const data = []; const lanes = Object.keys(eng);
    lanes.forEach((k, l) => eng[k].forEach((v, t) => data.push([t, l, +v.toFixed(1)])));
    mk('c-eng', {visualMap: {show: false, min: 0, max: 100, inRange: {color: C.q.slice(1)}},
      xAxis3D: {type: 'category', name: 'time', data: timeLabels, axisLabel: {color: C.text3, interval: 14}},
      yAxis3D: {type: 'category', name: 'engine', data: lanes, axisLabel: {color: C.text3}},
      zAxis3D: {type: 'value', name: '%', max: 100, axisLabel: {color: C.text3}},
      grid3D: {boxWidth: 170, boxDepth: 60, boxHeight: 50, axisLine: {lineStyle: {color: C.text3}}, splitLine: {lineStyle: {color: C.grid}},
        viewControl: {alpha: 22, beta: 30, distance: 210}, light: {main: {intensity: 1.1}, ambient: {intensity: 0.4}}},
      series: [{type: 'surface', data, wireframe: {show: true, lineStyle: {color: C.surface, width: 0.5}}, shading: 'lambert'}]});
  } else {
    const lanes = Object.keys(eng);
    mk('c-eng', {animation: false, tooltip: tip,
      grid: lanes.map((_, i) => ({left: 44, right: 54, top: 8 + i * 70, height: 52})),
      xAxis: lanes.map((_, i) => ({gridIndex: i, type: 'category', data: timeLabels, boundaryGap: false, ...baseAxis, splitLine: {show: false},
        axisLabel: {...baseAxis.axisLabel, show: i === lanes.length - 1, interval: 14}})),
      yAxis: lanes.map((k, i) => ({gridIndex: i, type: 'value', max: 100, splitNumber: 1, ...baseAxis, axisLine: {show: false}, axisLabel: {show: false},
        name: k, nameLocation: 'middle', nameRotate: 0, nameGap: 14, nameTextStyle: {color: C.text2, fontWeight: 600, fontSize: 11, align: 'right'}})),
      series: lanes.map((k, i) => ({type: 'line', xAxisIndex: i, yAxisIndex: i, data: eng[k], showSymbol: false, smooth: 0.3,
        lineStyle: {width: 1.5, color: C.s[0]}, areaStyle: {color: C.s[0], opacity: 0.15},
        endLabel: {show: true, color: C.text, fontWeight: 600, formatter: p => Math.round(p.value) + '%'}})),
    });
  }
  let a = 4.2; const ga = Array.from({length: N}, () => (a = Math.min(4.8, a + rnd() * 0.03)));
  mk('c-gmem', lineOpt([
    {name: 'python', data: ga, color: selected[0].color, stack: 'm', areaStyle: {opacity: 0.55}, lineStyle: {width: 1}},
    {name: 'chrome', data: walk(0.3, 0.04, 0.2, 0.4), color: selected[1].color, stack: 'm', areaStyle: {opacity: 0.55}, lineStyle: {width: 1}},
    {name: 'other', data: walk(1.0, 0.05, 0.9, 1.1), color: C.text3, stack: 'm', areaStyle: {opacity: 0.25}, lineStyle: {width: 1}},
  ], {unit: ' G', max: 12}));
  mk('c-gutil', {animation: false, grid: {left: 64, right: 44, top: 10, bottom: 20},
    xAxis: {type: 'value', max: 100, ...baseAxis, axisLabel: {...baseAxis.axisLabel, formatter: '{value}%'}},
    yAxis: {type: 'category', data: ['other', 'chrome', 'python'], ...baseAxis, splitLine: {show: false}, axisLabel: {color: C.text2}},
    series: [{type: 'bar', barWidth: 18, data: [{value: 10, itemStyle: {color: C.text3}}, {value: 4, itemStyle: {color: selected[1].color}}, {value: 68, itemStyle: {color: selected[0].color}}],
      itemStyle: {borderRadius: [0, 4, 4, 0]}, label: {show: true, position: 'right', color: C.text, formatter: '{c}%'}}]});
} else {
  // Details tab — focused on the chrome *app*: member breakdown
  const col = chromeApp.color;
  const mem = [['renderer 4821', 410], ['chrome (main) 4702', 380], ['gpu-process 4790', 220], ['renderer 4855', 190], ['renderer 4861', 170],
    ['renderer 4877', 150], ['extension 4740', 120], ['utility · network 4870', 62], ['utility · audio 4881', 40], ['14 others', 1060]];
  main.innerHTML = focusBar() + `
    <div class="card"><div class="card-h"><h3><span class="avatar" style="background:${col};color:#fff">C</span>chrome <span class="faint">· app · 23 processes</span></h3><span class="badge ok">running</span></div>
      <div class="stats" style="grid-template-columns:repeat(6,1fr)">
        <div class="stat"><div class="k">CPU</div><div class="v num">34.2%</div><div class="d">2.1% of all cores</div></div>
        <div class="stat"><div class="k">Memory</div><div class="v num">2.8 GB</div><div class="d">17% of RAM</div></div>
        <div class="stat"><div class="k">GPU</div><div class="v num">4%</div><div class="d">310 MB VRAM</div></div>
        <div class="stat"><div class="k">Processes</div><div class="v num">23</div><div class="d">+2 in last min</div></div>
        <div class="stat"><div class="k">Threads</div><div class="v num">312</div><div class="d">across members</div></div>
        <div class="stat"><div class="k">Disk I/O</div><div class="v num">88 KB/s</div><div class="d">read 60 · write 28</div></div>
      </div>
      <div class="faint" style="margin-top:8px">Grouped by cgroup <span class="mono">app-gnome-google-chrome-4702.scope</span> · user abi · started 2h 14m ago</div></div>
    <div class="grid g2">
      <div class="card"><div class="card-h"><h3>CPU by member process</h3><span class="sub">% of one core · now</span></div><div class="chart" id="c-mcpu" style="height:300px"></div></div>
      <div class="card"><div class="card-h"><h3>Memory by member process</h3><span class="sub">RSS · treemap</span></div><div class="chart" id="c-mtree" style="height:300px"></div></div>
    </div>
    <div class="grid g2">
      <div class="card"><div class="card-h"><h3><span style="color:${selected[0].color}">●</span> python <span class="faint mono">9134</span></h3><span class="badge ok">running</span></div>
        <dl class="kv"><dt>App</dt><dd>python (2 processes)</dd><dt>User</dt><dd>abi</dd><dt>Uptime</dt><dd>5m 02s</dd><dt>Threads</dt><dd>9</dd><dt>Command</dt><dd class="mono">python train.py --epochs 40 --batch 64</dd></dl></div>
      <div class="card exited"><div class="card-h"><h3><span style="color:${C.s[2]}">●</span> make <span class="faint mono">7702</span></h3><span class="badge gone">EXITED 12:41:07</span></div>
        <p class="muted" style="margin:0">Series kept until removed. <button class="btn">Remove</button></p></div>
    </div>`;
  const cpuM = [['renderer 4821', 18.1], ['gpu-process 4790', 9.4], ['chrome (main) 4702', 4.2], ['renderer 4855', 1.6], ['utility · network 4870', 0.5], ['18 others', 0.4]].reverse();
  mk('c-mcpu', {animation: false, grid: {left: 150, right: 50, top: 6, bottom: 22},
    xAxis: {type: 'value', ...baseAxis, axisLabel: {...baseAxis.axisLabel, formatter: '{value}%'}},
    yAxis: {type: 'category', data: cpuM.map(d => d[0]), ...baseAxis, splitLine: {show: false}, axisLabel: {color: C.text2}},
    series: [{type: 'bar', barWidth: 16, data: cpuM.map(d => ({value: d[1], itemStyle: {color: d[0].includes('others') ? C.text3 : col}})),
      itemStyle: {borderRadius: [0, 4, 4, 0]}, label: {show: true, position: 'right', color: C.text, formatter: '{c}%'}}]});
  mk('c-mtree', {animation: false, tooltip: {formatter: p => `${p.name}: ${p.value} MB`},
    series: [{type: 'treemap', roam: false, nodeClick: false, breadcrumb: {show: false}, width: '100%', height: '100%', top: 0, left: 0,
      itemStyle: {borderColor: C.surface, borderWidth: 2, gapWidth: 2},
      label: {show: true, formatter: p => `{n|${p.name}}\n{v|${p.value >= 1000 ? (p.value / 1000).toFixed(1) + ' GB' : p.value + ' MB'}}`,
        rich: {n: {color: '#fff', fontSize: 12, fontWeight: 600}, v: {color: 'rgba(255,255,255,.85)', fontSize: 11, padding: [3, 0, 0, 0]}}},
      data: mem.map((d, i) => ({name: d[0], value: d[1], itemStyle: {color: d[0].includes('others') ? C.text3 : col, opacity: d[0].includes('others') ? 1 : 1 - i * 0.07}}))}]});
}
</script>
</body>
